{% extends 'base.html' %}
{% block content %}
<div class="page-shell">
  <div class="page-title">
    <h1>Update Diagnosis</h1>
    <p>Patient: {{ patient.name }}</p>
  </div>

  <div class="legacy-panel form-section">
    <form method="POST" action="{% url 'diagnosis_detail' patient.id health_record.id %}">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          {% for field in form %}
            {% if field.errors %}{{ field.errors }}{% endif %}
          {% endfor %}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endif %}

      {{ form.as_p }}

      <div class="action-row">
        <button class="btn btn-success" type="submit">Update Diagnosis</button>
        <a class="btn btn-secondary" href="{% url 'diagnosis' patient.id %}">Back to Diagnoses</a>
      </div>
    </form>

    <hr>
    <form action="{% url 'delete_diagnosis' patient.id health_record.id %}" method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete Diagnosis</button>
    </form>
  </div>
</div>
{% endblock %}
