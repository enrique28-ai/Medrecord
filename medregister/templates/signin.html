{% extends 'base.html' %}
{% block title %}Sign in · MedRecord{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="form-card">
    <header class="form-card__header">
      <p class="page-eyebrow">Account access</p>
      <h1>Sign in</h1>
      <p>Access your patient and diagnosis records.</p>
    </header>

    <form method="post" action="{% url 'signin' %}" class="medrecord-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-medrecord">Sign in</button>
        <a class="btn-outline-medrecord" href="{% url 'signup' %}">Create account</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
