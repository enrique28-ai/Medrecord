{% extends 'base.html' %}

{% block content %}
<div class="page-shell">
  <div class="page-title">
    <h1>Patients</h1>
    <p>View and manage the patient records in your account.</p>
  </div>

  <div class="legacy-panel">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a class="btn btn-primary" href="{% url 'create_patient' %}">Add Patient</a>
    </div>

    <form method="get" action="{% url 'patients' %}" class="input-group mb-4">
      <input type="text" name="q" value="{{ query }}" class="form-control" placeholder="Search patient...">
      <button class="btn btn-outline-secondary" type="submit">Search</button>
    </form>

    <div class="list-group legacy-list">
      {% for patient in patients %}
        <a class="list-group-item list-group-item-action" href="{% url 'patient_detail' patient.id %}">
          <div class="record-row">
            <h2 class="h5">{{ patient.name }}</h2>
            <span class="record-meta">Age: {{ patient.age }}</span>
          </div>
        </a>
      {% empty %}
        <div class="text-muted">No patients found.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
