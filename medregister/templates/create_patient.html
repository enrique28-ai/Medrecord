{% extends 'base.html' %}
{% block title %}Add patient · MedRecord{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="form-card">
    <header class="form-card__header">
      <p class="page-eyebrow">Patient record</p>
      <h1>Add patient</h1>
      <p>Create a patient record that will provide the context for related diagnosis entries.</p>
    </header>

    <form method="post" action="{% url 'create_patient' %}" class="medrecord-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-medrecord">Add patient</button>
        <a class="btn-outline-medrecord" href="{% url 'patients' %}">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
