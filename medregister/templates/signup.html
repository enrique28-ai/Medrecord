{% extends 'base.html' %}
{% block title %}Create account · MedRecord{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="form-card">
    <header class="form-card__header">
      <p class="page-eyebrow">New account</p>
      <h1>Create account</h1>
      <p>Create an account to organize your own patient and diagnosis records.</p>
    </header>

    <form method="post" action="{% url 'signup' %}" class="medrecord-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-medrecord">Create account</button>
        <a class="btn-outline-medrecord" href="{% url 'signin' %}">I already have an account</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
