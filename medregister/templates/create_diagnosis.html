{% extends 'base.html' %}
{% block title %}Add diagnosis · MedRecord{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="form-card">
    <header class="form-card__header">
      <p class="page-eyebrow">Diagnosis record</p>
      <h1>Add diagnosis</h1>
      <p>This entry will remain connected to {{ patient.name }}.</p>
    </header>
    <form method="post" action="{% url 'create_diagnosis' patient.id %}" class="medrecord-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-medrecord">Add diagnosis</button>
        <a class="btn-outline-medrecord" href="{% url 'diagnosis' patient.id %}">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
